<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fine Flowers Studio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{
  --rose:#6B2737;--rose-mid:#8B3A4A;--rose-deep:#3D1420;--rose-light:#C06070;
  --nude:#C9A89A;--nude-l:#E8D5CC;--nude-p:#FAF2EE;--nude-d:#A87868;
  --bg:#FEFCFB;--bg2:#F8F1EE;--bg3:#F0E5E0;
  --tx:#1A0D0A;--tx2:#5C3530;--tx3:#9A706A;--tx4:#C4A098;
  --br:rgba(107,39,55,0.1);--br2:rgba(107,39,55,0.2);
  --green-bg:#EAF3DE;--green-fg:#2E6B0A;
  --amber-bg:#FFF3CD;--amber-fg:#7A5800;
  --blue-bg:#E8F4FD;--blue-fg:#0A5FA0;
  --red-bg:#FDECEA;--red-fg:#A32020;
  --purple-bg:#F3EEFF;--purple-fg:#5A2D82;
  --shadow:0 2px 8px rgba(107,39,55,0.1);
  --shadow-lg:0 8px 24px rgba(107,39,55,0.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg3);color:var(--tx);font-size:14px;line-height:1.55;}

/* ── LOGIN ── */
.login-screen{position:fixed;inset:0;background:var(--rose-deep);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
.login-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:40px 36px;max-width:380px;width:100%;text-align:center;}
.login-logo{font-family:'DM Serif Display',serif;font-size:28px;color:#fff;letter-spacing:.04em;margin-bottom:4px;}
.login-sub{font-size:12px;color:rgba(255,255,255,.35);margin-bottom:28px;letter-spacing:.08em;text-transform:uppercase;}
.login-label{font-size:11px;font-weight:600;color:rgba(255,255,255,.4);text-align:left;margin-bottom:5px;letter-spacing:.05em;text-transform:uppercase;}
.login-sel,.login-inp{width:100%;padding:11px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:#fff;font-size:14px;font-family:'DM Sans',sans-serif;margin-bottom:14px;appearance:none;}
.login-sel option{background:#3D1420;color:#fff;}
.login-inp::placeholder{color:rgba(255,255,255,.3);}
.login-inp:focus,.login-sel:focus{outline:none;border-color:var(--nude);}
.login-err{font-size:12px;color:#FF8080;min-height:16px;margin-bottom:10px;}
.login-btn{width:100%;padding:12px;background:var(--rose);color:#fff;border:none;border-radius:10px;font-family:'DM Serif Display',serif;font-size:15px;cursor:pointer;transition:background .15s;}
.login-btn:hover{background:var(--rose-mid);}

/* ── APP ── */
.app{display:flex;height:100vh;overflow:hidden;}
.sb{width:220px;flex-shrink:0;background:var(--rose-deep);display:flex;flex-direction:column;overflow-y:auto;transition:width .2s;}
.sb::-webkit-scrollbar{width:0;}
.sb-brand{padding:14px 14px 12px;border-bottom:1px solid rgba(255,255,255,.07);text-align:center;}
.sb-brand .logo-text{font-family:'DM Serif Display',serif;font-size:16px;color:#fff;letter-spacing:.05em;line-height:1.2;}
.sb-brand .logo-sub{font-size:9px;color:rgba(255,255,255,.3);letter-spacing:.15em;text-transform:uppercase;margin-top:2px;}
.sb-user{padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:8px;}
.sb-user .av{width:28px;height:28px;border-radius:50%;background:var(--rose-light);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}
.sb-user .un{font-size:12px;color:rgba(255,255,255,.6);flex:1;}
.sb-user .logout{background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:13px;padding:2px;}
.sb-user .logout:hover{color:#fff;}
.sb-nav{padding:8px 0 24px;flex:1;}
.nl{font-size:10px;font-weight:600;color:rgba(255,255,255,.2);letter-spacing:.12em;text-transform:uppercase;padding:10px 16px 3px;}
.ni{display:flex;align-items:center;gap:9px;padding:8px 14px 8px 16px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.5);border-left:2px solid transparent;transition:all .12s;}
.ni:hover{background:var(--nude-p);color:var(--rose);}
.ni.on{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--nude);}
.ni i{font-size:15px;flex-shrink:0;}
.ni .nbadge{margin-left:auto;background:var(--rose-light);color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:20px;min-width:18px;text-align:center;}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--br);box-shadow:var(--shadow);flex-shrink:0;gap:10px;}
.tb-left .tp{font-family:'DM Serif Display',serif;font-size:17px;}
.tb-left .tps{font-size:11px;color:var(--tx3);margin-top:1px;}
.tb-right{display:flex;gap:7px;align-items:center;flex-shrink:0;}
.content{flex:1;overflow-y:auto;padding:16px 20px;}
.content::-webkit-scrollbar{width:4px;}
.content::-webkit-scrollbar-thumb{background:var(--br2);border-radius:4px;}
.sec{display:none;}.sec.on{display:block;}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--br2);background:var(--bg);color:var(--tx);font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .12s;white-space:nowrap;font-weight:500;}
.btn:hover{background:var(--nude-p);border-color:var(--nude-d);color:var(--rose);}
.btn.pri{background:var(--rose);color:#fff;border-color:var(--rose);}
.btn.pri:hover{background:var(--rose-mid);color:#fff;}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx3);}
.btn.ghost:hover{background:var(--bg2);color:var(--tx);}
.btn.wa{background:#25D366;color:#fff;border-color:#25D366;}
.btn.wa:hover{background:#1ebe5d;color:#fff;}
.ib{display:inline-flex;align-items:center;padding:5px;border:none;background:none;cursor:pointer;color:var(--tx3);border-radius:6px;transition:all .12s;}
.ib:hover{background:var(--nude-p);color:var(--rose);}
.ib i{font-size:14px;}

/* ── CARDS ── */
.card{background:var(--bg);border:1px solid var(--br);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px;}
.ch{display:flex;align-items:center;justify-content:space-between;padding:10px 15px;border-bottom:1px solid var(--br);background:var(--bg2);}
.ch h3{font-size:14px;font-weight:600;}
.ch-r{display:flex;align-items:center;gap:7px;}

/* ── TILES ── */
.sg{display:grid;gap:10px;margin-bottom:14px;}
.sg5{grid-template-columns:repeat(5,1fr);}
.sg4{grid-template-columns:repeat(4,1fr);}
.sg3{grid-template-columns:repeat(3,1fr);}
.sg2{grid-template-columns:repeat(2,1fr);}
.tile{background:var(--bg);border:1px solid var(--br);border-radius:11px;padding:13px 15px;box-shadow:var(--shadow);}
.tile.t-rose{border-left:3px solid var(--rose);}
.tile.t-green{border-left:3px solid var(--green-fg);}
.tile.t-red{border-left:3px solid var(--red-fg);}
.tile.t-blue{border-left:3px solid var(--blue-fg);}
.tile .tl{font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.tile .tv{font-size:20px;font-weight:700;line-height:1.2;}
.tile .ts{font-size:11px;color:var(--tx4);margin-top:3px;}

/* ── TABLE ── */
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{padding:8px 12px;text-align:left;font-size:11px;font-weight:700;color:var(--tx3);border-bottom:1px solid var(--br);background:var(--bg2);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;}
td{padding:8px 12px;border-bottom:1px solid var(--br);vertical-align:middle;font-size:13px;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--nude-p);}
.cb-col{width:36px;}
input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:var(--rose);}

/* ── BADGES ── */
.bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.bdg-green{background:var(--green-bg);color:var(--green-fg);}
.bdg-amber{background:var(--amber-bg);color:var(--amber-fg);}
.bdg-blue{background:var(--blue-bg);color:var(--blue-fg);}
.bdg-purple{background:var(--purple-bg);color:var(--purple-fg);}
.bdg-red{background:var(--red-bg);color:var(--red-fg);}
.bdg-nude{background:var(--nude-p);color:var(--rose);}
.tog{width:40px;height:22px;background:#ccc;border-radius:20px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
.tog::after{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:3px;left:3px;transition:left .2s;}
.tog.tog-on{background:var(--rose);}
.tog.tog-on::after{left:21px;}
.bdg-gray{background:var(--bg3);color:var(--tx3);}
.bdg-gold{background:#FFF3CD;color:#7A5800;}

/* ── GRID FORMS ── */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:15px;}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;padding:15px;}
.fg4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:11px;padding:15px;}
.fspan{grid-column:1/-1;}
.grp{display:flex;flex-direction:column;gap:4px;}
.grp label{font-size:11px;font-weight:600;color:var(--tx2);}
.grp input,.grp select,.grp textarea{padding:8px 10px;border-radius:8px;border:1.5px solid var(--br2);background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:13px;transition:border-color .12s;}
.grp input:focus,.grp select:focus,.grp textarea:focus{outline:none;border-color:var(--rose);}
.grp textarea{resize:vertical;min-height:56px;}
.sel-sm{font-size:12px;padding:5px 8px;border:1px solid var(--br2);border-radius:7px;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;}
.inp-sm{font-size:12px;padding:5px 8px;border:1px solid var(--br2);border-radius:7px;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;}

/* ── TABS ── */
.tbar{display:flex;border-bottom:1px solid var(--br);background:var(--bg2);overflow-x:auto;padding:0 12px;flex-shrink:0;}
.tbar::-webkit-scrollbar{height:0;}
.tab{padding:9px 13px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--tx3);white-space:nowrap;transition:all .12s;}
.tab:hover{color:var(--rose);}
.tab.on{color:var(--rose);border-bottom-color:var(--rose);}

/* ── FILTER BAR ── */
.fbar{display:flex;gap:7px;padding:9px 13px;border-bottom:1px solid var(--br);flex-wrap:wrap;align-items:center;background:var(--bg2);}
.fbar input,.fbar select{font-size:12px;padding:6px 9px;border:1px solid var(--br2);border-radius:7px;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;}
.fbar input:focus,.fbar select:focus{outline:none;border-color:var(--rose);}

/* ── MODAL ── */
.ov{position:fixed;inset:0;background:rgba(30,8,5,.55);display:none;align-items:center;justify-content:center;z-index:9000;padding:16px;backdrop-filter:blur(3px);}
.ov.open{display:flex;}
.modal{background:var(--bg);border-radius:15px;width:100%;max-height:94vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);border:1px solid var(--br2);}
.modal.wide{max-width:800px;}.modal.mid{max-width:560px;}.modal.narrow{max-width:400px;}
.mh{padding:13px 17px;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.mh h3{font-family:'DM Serif Display',serif;font-size:16px;}
.mb{overflow-y:auto;flex:1;}
.mf{padding:11px 17px;border-top:1px solid var(--br);display:flex;justify-content:flex-end;gap:7px;flex-shrink:0;}

/* ── MISC ── */
.alert{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;}
.alert-gold{background:#FFF9E6;color:#7A5800;border:1px solid #F0D080;}
.alert-info{background:var(--blue-bg);color:var(--blue-fg);}
.alert-warn{background:var(--amber-bg);color:var(--amber-fg);}
.es{text-align:center;padding:32px 20px;color:var(--tx3);}
.es i{font-size:28px;display:block;margin-bottom:8px;color:var(--tx4);}
.es .et{font-size:14px;font-weight:500;color:var(--tx2);margin-bottom:3px;}
.es p{font-size:12px;}
.prog-bar{background:var(--bg3);border-radius:20px;height:7px;overflow:hidden;}
.prog-fill{height:100%;border-radius:20px;background:var(--rose);transition:width .4s;}
.loading{text-align:center;padding:24px;color:var(--tx3);font-size:13px;}
.loading i{display:block;font-size:20px;margin-bottom:6px;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:7px;}
.toast{background:var(--rose-deep);color:#fff;padding:9px 14px;border-radius:9px;font-size:13px;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow-lg);transform:translateX(120%);opacity:0;transition:all .3s;max-width:260px;}
.toast.show{transform:translateX(0);opacity:1;}
.toast.t-err{background:#8B1A1A;}.toast.t-ok{background:#2E6B0A;}
.owner-badge{display:inline-flex;align-items:center;gap:5px;background:var(--nude-p);color:var(--rose);border:1px solid var(--br2);border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600;}
.pin-modal-inp{width:100%;padding:14px;border-radius:10px;border:1.5px solid var(--br2);background:var(--bg);color:var(--tx);font-size:18px;text-align:center;letter-spacing:.3em;font-family:'DM Sans',sans-serif;margin-bottom:8px;}
.pin-modal-inp:focus{outline:none;border-color:var(--rose);}

/* ── CUSTOMER FORM ── */
.cform-wrap{min-height:100vh;background:linear-gradient(160deg,var(--nude-p) 0%,#fff 60%,var(--bg2) 100%);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px 60px;}
.cform-card{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:540px;overflow:hidden;border:1px solid var(--br);}
.cform-head{background:var(--rose-deep);padding:28px 24px 22px;text-align:center;}
.cform-title{font-family:'DM Serif Display',serif;font-size:30px;color:#fff;letter-spacing:.06em;margin-bottom:4px;}
.cform-div{width:40px;height:1px;background:rgba(255,255,255,.25);margin:8px auto;}
.cform-tag{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.18em;text-transform:uppercase;}
.cform-outer-label{font-family:'DM Serif Display',serif;font-size:15px;color:var(--rose);text-align:center;padding:14px 24px 0;letter-spacing:.04em;}
.cform-desc{font-size:13px;color:var(--tx3);text-align:center;padding:6px 24px 16px;line-height:1.6;}
.cform-body{padding:0 24px 24px;}
.cform-sec{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em;padding:5px 0;border-bottom:1px solid var(--br);margin:14px 0 14px;}
.cfgrp{margin-bottom:13px;}
.cfgrp label{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:5px;}
.cfgrp .req{color:var(--rose);}
.cfgrp input,.cfgrp select,.cfgrp textarea{width:100%;padding:10px 12px;border:1.5px solid var(--br2);border-radius:9px;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--tx);background:#fff;transition:border-color .12s;}
.cfgrp input:focus,.cfgrp select:focus,.cfgrp textarea:focus{outline:none;border-color:var(--rose);}
.cfgrp textarea{min-height:76px;resize:vertical;}
.cform-submit{width:100%;padding:13px;background:var(--rose);color:#fff;border:none;border-radius:10px;font-family:'DM Serif Display',serif;font-size:15px;cursor:pointer;transition:background .15s;margin-top:6px;}
.cform-submit:hover{background:var(--rose-mid);}
.cform-submit:disabled{opacity:.65;cursor:not-allowed;}
.cform-submit-note{text-align:center;font-size:12px;color:var(--tx3);margin-top:8px;line-height:1.6;}
.cform-footer{text-align:center;font-size:12px;color:var(--tx4);padding:14px 24px 20px;border-top:1px solid var(--br);margin-top:6px;font-style:italic;}
.cform-success{text-align:center;padding:36px 24px;}
.cform-success h2{font-family:'DM Serif Display',serif;font-size:22px;color:var(--rose);margin-bottom:8px;}
.cform-success p{font-size:14px;color:var(--tx3);line-height:1.7;margin-bottom:16px;}

/* ── MOBILE ── */
@media(max-width:768px){
  .sb{position:fixed;left:-220px;top:0;bottom:0;z-index:800;transition:left .25s;}
  .sb.mob-open{left:0;}
  .mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:799;}
  .mob-overlay.show{display:block;}
  .main{width:100%;}
  .topbar{padding:9px 14px;}
  .content{padding:12px 12px;}
  .sg5,.sg4{grid-template-columns:1fr 1fr;}
  .sg3{grid-template-columns:1fr 1fr;}
  .sg2{grid-template-columns:1fr 1fr;}
  .fg,.fg3,.fg4{grid-template-columns:1fr 1fr;}
  .mob-menu-btn{display:flex!important;}
  .modal.wide,.modal.mid{max-width:100%;}
}
@media(max-width:480px){
  .sg5,.sg4,.sg3,.sg2{grid-template-columns:1fr 1fr;}
  .fg3,.fg4{grid-template-columns:1fr 1fr;}
  .fg{grid-template-columns:1fr;}
}
.mob-menu-btn{display:none;align-items:center;padding:5px;border:none;background:none;cursor:pointer;color:var(--tx3);border-radius:7px;}
.mob-menu-btn:hover{background:var(--bg2);}
.mob-menu-btn i{font-size:20px;}
</style>
</head>

<script>

// ── SUPABASE API ───────────────────────────────────────────
async function api(table,method,body,q){
  var isGet=!method||method==='GET';
  var url=SUPA+'/rest/v1/'+table+(q||'');
  if(isGet)url+=(url.indexOf('?')>=0?'&':'?')+'_cb='+Date.now();
  var h={'Content-Type':'application/json','apikey':AKEY,'Authorization':'Bearer '+AKEY,'Cache-Control':'no-cache'};
  if(method==='POST')h['Prefer']='return=representation';

  if(!r.ok)throw new Error(await r.text());
  if(method==='DELETE'||r.status===204)return true;
  var t=await r.text();return t?JSON.parse(t):[];
}

function U(t,id,b){return api(t,'PATCH',b,'?id=eq.'+id);}
function D(t,id){return api(t,'DELETE',null,'?id=eq.'+id);}

// Smart date parse: "13/2" → "2026-02-13"
function parseDate(s){
  if(!s)return td();
  s=s.trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  var parts=s.split(/[\/\-\.]/);
  if(parts.length>=2){
    var d=parts[0].padStart(2,'0');
    var m=parts[1].padStart(2,'0');
    var y=parts[2]?parts[2].length===2?'20'+parts[2]:parts[2]:cY().toString();
    return y+'-'+m+'-'+d;
  }
  return td();
}
function fmtD(d){if(!d)return'-';try{return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'});}catch(e){return d;}}
function fmtT12(t){if(!t)return'-';try{var p=t.split(':');var h=+p[0];var m=p[1]||'00';var a=h>=12?'PM':'AM';h=h%12||12;return h+':'+m+' '+a;}catch(e){return t;}}
function to12(t){return fmtT12(t);}

// ── ORDER FORM HELPERS ────────────────────────────────────
function toggleAddrField(){
  var t=(document.getElementById('om-type')||{value:'Self-pickup'}).value;
  var ag=document.getElementById('om-addr-grp');var dg=document.getElementById('om-dc-grp');var dbg=document.getElementById('om-delby-grp');
  if(ag)ag.style.display=t==='Delivery'?'':'none';
  if(dg)dg.style.display=t==='Delivery'?'':'none';
  if(dbg)dbg.style.display=t==='Delivery'?'':'none';
}
function autoFillPrice(){
  var pname=(document.getElementById('om-prod')||{value:''}).value;
  var qty=+(document.getElementById('om-qty')||{value:1}).value||1;
  var prod=(S.products||[]).find(function(p){return p.name===pname;});
  if(prod){var ppEl=document.getElementById('om-pp');if(ppEl)ppEl.value=(prod.price*qty).toFixed(0);}
  calcTotal();
}
function calcTotal(){
  var pp=+(document.getElementById('om-pp')||{value:0}).value||0;
  var ap=+(document.getElementById('om-ap')||{value:0}).value||0;
  var dc=+(document.getElementById('om-dc')||{value:0}).value||0;
  var el=document.getElementById('om-tot');if(el)el.value=(pp+ap+dc).toFixed(0);
}
function calcProdTotal(){
  var mat=+(document.getElementById('pm-mat')||{value:0}).value||0;
  var pack=+(document.getElementById('pm-pack')||{value:0}).value||0;
  var mins=+(document.getElementById('pm-labmins')||{value:0}).value||0;
  var rate=+(document.getElementById('pm-labrate')||{value:9}).value||9;
  var labCost=Math.round(mins/60*rate*100)/100;
  var del=+(document.getElementById('pm-delcost')||{value:0}).value||0;
  var total=Math.round((mat+pack+labCost+del)*100)/100;
  var labEl=document.getElementById('pm-labcost');if(labEl)labEl.value=labCost.toFixed(2);
  var costEl=document.getElementById('pm-cost');if(costEl)costEl.value=total.toFixed(2);
  calcMargin();
}
function calcMargin(){
  var price=+(document.getElementById('pm-price')||{value:0}).value||0;
  var cost=+(document.getElementById('pm-cost')||{value:0}).value||0;
  var el=document.getElementById('pm-margin');if(!el)return;
  if(!price){el.textContent='-';el.style.color='var(--tx3)';return;}
  var margin=Math.round((price-cost)/price*100);
  var color=margin>=55?'var(--green-fg)':margin>=40?'var(--amber-fg)':'var(--red-fg)';
  el.style.color=color;
  el.innerHTML='<span style="color:'+color+';font-size:16px;font-weight:700">'+margin+'%</span> <span style="font-size:11px;color:var(--tx3)">gross margin &nbsp;|&nbsp; Cost: '+rm(cost)+' &nbsp;|&nbsp; Price: '+rm(price)+'</span>';
}
function openProductM(pid){
  editId=pid||null;
  var catSel=document.getElementById('pm-cat');if(catSel)catSel.innerHTML=getCatOptions();
  var flds=['pm-name','pm-price','pm-mat','pm-pack','pm-labmins','pm-labwho','pm-labrate','pm-labcost','pm-delcost','pm-cost','pm-flowers','pm-remark'];
  flds.forEach(function(id){var e=document.getElementById(id);if(e)e.value='';});
  var mg=document.getElementById('pm-margin');if(mg){mg.innerHTML='-';mg.style.color='var(--tx3)';}
  if(pid){
    var p=(S.products||[]).find(function(x){return x.id===pid;});
    if(p){
      document.getElementById('pm-name').value=p.name||'';
      document.getElementById('pm-cat').value=p.category||'';
      document.getElementById('pm-price').value=p.price||'';
      document.getElementById('pm-mat').value=p.mat_cost||'';
      document.getElementById('pm-pack').value=p.pack_cost||'';
      document.getElementById('pm-labmins').value=p.labour_mins||'';
      document.getElementById('pm-labwho').value=p.labour_who||'';
      document.getElementById('pm-labrate').value=p.labour_rate||9;
      document.getElementById('pm-labcost').value=p.labour_cost||'';
      document.getElementById('pm-delcost').value=p.delivery_cost||'';
      document.getElementById('pm-cost').value=p.cost||'';
      document.getElementById('pm-flowers').value=p.flowers||'';
      document.getElementById('pm-remark').value=p.remark||'';
      calcMargin();
    }
  }
  document.getElementById('prod-t').textContent=pid?'Edit Product':'Add Product';
  openModal('ov-prod');
}
async function saveProduct(){
  var name=(document.getElementById('pm-name')||{value:''}).value.trim();if(!name){alert('Name required.');return;}
  var price=+(document.getElementById('pm-price')||{value:0}).value||0;
  var mat=+(document.getElementById('pm-mat')||{value:0}).value||0;
  var pack=+(document.getElementById('pm-pack')||{value:0}).value||0;
  var labMins=+(document.getElementById('pm-labmins')||{value:0}).value||0;
  var labWho=(document.getElementById('pm-labwho')||{value:''}).value.trim();
  var labRate=+(document.getElementById('pm-labrate')||{value:9}).value||9;
  var labCost=Math.round(labMins/60*labRate*100)/100;
  var delCost=+(document.getElementById('pm-delcost')||{value:0}).value||0;
  var totalCost=Math.round((mat+pack+labCost+delCost)*100)/100;
  var p={id:editId||('p'+Date.now()),category:(document.getElementById('pm-cat')||{value:''}).value,name:name,price:price,cost:totalCost,mat_cost:mat,pack_cost:pack,labour_mins:labMins,labour_who:labWho,labour_rate:labRate,labour_cost:labCost,delivery_cost:delCost,flowers:(document.getElementById('pm-flowers')||{value:''}).value.trim(),remark:(document.getElementById('pm-remark')||{value:''}).value.trim()};
  var prods=S.products||[];
  if(editId){var idx=prods.findIndex(function(x){return x.id===editId;});if(idx>=0)prods[idx]=p;else prods.push(p);}
  else prods.push(p);
  await saveSetting('products',prods);
  closeModal('ov-prod');renderProdSheet();renderProducts();toast('Product saved! 🌸');
}

async function qStatus(id,cur){
  var cycle=['Pending','Ready','Done'];var next=cycle[(cycle.indexOf(cur)+1)%cycle.length];
  try{
    await U('orders',id,{status:next});
    // if delivery cost exists, sync to expenses
    var rows=await G('orders','?id=eq.'+id);
    if(rows[0]&&rows[0].dcost&&next==='Done'){
      await P('expenses',{date:rows[0].pref_date||td(),category:'Delivery Bill',description:'Delivery for '+rows[0].cname,amount:+rows[0].dcost,notes:'Auto from order'});
    }
    renderDash();updPB();toast('Status: '+next);
  }catch(e){toast('Error','err');}
}
function renderTasksInDash(tasks){
  var el=document.getElementById('d-tasks');if(!el)return;
  if(!tasks||!tasks.length){el.innerHTML='<div class="es" style="padding:18px"><i class="ti ti-clipboard-list"></i><div class="et">No tasks</div><p>Add duties for staff</p></div>';return;}
  el.innerHTML=tasks.slice(0,15).map(function(t){
    var pb=t.priority==='Urgent'?'<span class="bdg bdg-red">Urgent</span>':t.priority==='Low'?'<span class="bdg bdg-gray">Low</span>':'';
    return'<div style="display:flex;align-items:flex-start;gap:10px;padding:9px 14px;border-bottom:1px solid var(--br);font-size:13px">'
      +'<div style="min-width:72px;font-weight:600;color:var(--rose)">'+esc(t.staff_name||'-')+'</div>'
      +'<div style="flex:1"><div>'+esc(t.duty||'')+'</div><div style="font-size:11px;color:var(--tx3)">'+fmtD(t.date)+' '+pb+'</div></div>'
      +'<input style="flex:1;padding:4px 7px;border:1px solid var(--br2);border-radius:6px;font-size:12px;background:var(--bg);color:var(--tx);min-width:100px" placeholder="Remark..." value="'+esc(t.remark||'')+'" onblur="updateTaskRemark(\''+t.id+'\',this.value)">'
      +'<div style="display:flex;gap:3px;flex-shrink:0">'
      +(t.status==='Done'?'<span class="bdg bdg-green">Done</span>':'<span class="bdg bdg-amber">Pending</span>')
      +'<button class="ib" onclick="toggleTaskDone(\''+t.id+'\',\''+t.status+'\')" title="Toggle"><i class="ti ti-check"></i></button>'
      +'<button class="ib" onclick="delTask(\''+t.id+'\')" title="Delete"><i class="ti ti-trash"></i></button>'
      +'</div></div>';
  }).join('');
}
function renderRestockReminder(restock){
  var el=document.getElementById('d-restock');if(!el)return;
  if(!restock||!restock.length){el.innerHTML='<div class="es" style="padding:18px"><i class="ti ti-package"></i><div class="et">No restock entries</div><p>Log restocking to track here</p></div>';return;}
  var map={};restock.forEach(function(r){if(!map[r.item]||r.date>map[r.item].date)map[r.item]=r;});
  var items=Object.values(map).sort(function(a,b){return a.date<b.date?1:-1;});
  el.innerHTML='<div class="tw"><table><thead><tr><th>Item</th><th>Category</th><th>Last Restocked</th><th>Days Ago</th><th>Last Qty</th></tr></thead><tbody>'
    +items.map(function(r){var days=Math.floor((new Date()-new Date(r.date))/(864e5));var urg=days>=14?'bdg-red':days>=7?'bdg-amber':'bdg-green';
      return'<tr><td><strong>'+esc(r.item)+'</strong></td><td><span class="bdg bdg-gray">'+esc(r.category||'-')+'</span></td><td>'+fmtD(r.date)+'</td><td><span class="bdg '+urg+'">'+days+' days</span></td><td>'+esc(r.qty||'-')+'</td></tr>';}).join('')
    +'</tbody></table></div>';
}

  sec.innerHTML='<div class="alert alert-gold"><i class="ti ti-crown"></i>P&amp;L — auto-calculated. Cash in/out below.</div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px"><select class="sel-sm" id="pl-m" onchange="renderPL()">'
    +Array.from({length:12},function(_,i){return'<option value="'+(i+1)+'"'+(i+1===cM()?' selected':'')+'>'+MONTHS[i+1]+'</option>';}).join('')
    +'</select><select class="sel-sm" id="pl-y" onchange="renderPL()"></select>'
    +'<button class="btn sm" style="margin-left:auto" onclick="exportPL()"><i class="ti ti-download"></i> Export Ledger</button></div>'
    +'<div class="card" style="margin-bottom:14px"><div class="ch"><h3>Revenue</h3></div><div id="pl-rev" style="padding:14px"></div></div>'
    +'<div class="card" style="margin-bottom:14px"><div class="ch"><h3>Costs</h3></div><div id="pl-costs" style="padding:14px"></div></div>'
    +'<div class="card" style="margin-bottom:14px"><div class="ch"><h3>Bottom Line</h3></div><div class="sg sg4" id="pl-bot" style="padding:14px;margin-bottom:0"></div></div>'
    +'<div class="card" style="margin-bottom:14px"><div class="ch"><h3>Monthly Revenue Chart</h3></div><canvas id="pl-chart" style="padding:14px;max-height:260px"></canvas></div>'
    +'<div class="card"><div class="ch"><h3>Manual Cash In / Cash Out</h3><button class="btn sm" onclick="addCashEntry()"><i class="ti ti-plus"></i> Add Entry</button></div>'
    +'<div class="tw"><table><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Amount</th><th></th></tr></thead><tbody id="cash-tb"></tbody></table></div></div>';
  var yrSel=document.getElementById('pl-y');var cy=cY();if(yrSel){yrSel.innerHTML='';for(var yr=cy;yr>=cy-2;yr--)yrSel.innerHTML+='<option value="'+yr+'"'+(yr===cy?' selected':'')+'>'+yr+'</option>';}
  var pm=+(document.getElementById('pl-m')||{value:cM()}).value||cM();var py=+(document.getElementById('pl-y')||{value:cy}).value||cy;
  try{
    var res=await Promise.all([G('orders',''),G('walkin',''),G('expenses',''),G('cash_entries','?order=date.desc')]);
    var orders=res[0],wi=res[1],exp=res[2],cash=res[3]||[];
    var mWI=wi.filter(function(r){return gM(r.date)===pm&&gY(r.date)===py;}).reduce(function(s,r){return s+(+r.amount||0);},0);
    var mON=orders.filter(function(r){return gM(r.pref_date)===pm&&gY(r.pref_date)===py;}).reduce(function(s,r){return s+(+r.total||0);},0);
    var tot=mWI+mON;
    var cats=['Stock Up - Flowers','Stock Up - Packaging','Stock Up - Drinks/Cafe','Delivery Bill','Material','Vendor Paid','Salary','Rent','Utilities','Bills','Marketing','Other'];
    var expByCat={};cats.forEach(function(c){expByCat[c]=exp.filter(function(r){return r.category===c&&gM(r.date)===pm&&gY(r.date)===py;}).reduce(function(s,r){return s+(+r.amount||0);},0);});
    var totExp=Object.values(expByCat).reduce(function(s,v){return s+v;},0);
    var gross=tot;var net=gross-totExp;
    document.getElementById('pl-rev').innerHTML='<div style="display:flex;flex-wrap:wrap;gap:14px">'
      +'<div style="flex:1;min-width:160px;padding:12px;background:var(--bg2);border-radius:9px"><div style="font-size:11px;color:var(--tx3)">Walk-in</div><div style="font-size:20px;font-weight:700">'+rm(mWI)+'</div></div>'
      +'<div style="flex:1;min-width:160px;padding:12px;background:var(--bg2);border-radius:9px"><div style="font-size:11px;color:var(--tx3)">Online Orders</div><div style="font-size:20px;font-weight:700">'+rm(mON)+'</div></div>'
      +'<div style="flex:1;min-width:160px;padding:12px;background:var(--nude-p);border-radius:9px;border-left:3px solid var(--rose)"><div style="font-size:11px;color:var(--tx3)">Total Revenue</div><div style="font-size:22px;font-weight:700;color:var(--rose)">'+rm(tot)+'</div></div>'
      +'</div>';
    document.getElementById('pl-costs').innerHTML='<div style="display:flex;flex-wrap:wrap;gap:12px">'
      +cats.map(function(c){return expByCat[c]?'<div style="padding:10px 12px;background:var(--bg2);border-radius:9px;min-width:120px"><div style="font-size:11px;color:var(--tx3)">'+c+'</div><div style="font-size:16px;font-weight:600">'+rm(expByCat[c])+'</div></div>':'';}).join('')
      +'<div style="padding:10px 12px;background:var(--red-bg);border-radius:9px;min-width:120px;border-left:3px solid var(--red-fg)"><div style="font-size:11px;color:var(--red-fg)">Total Costs</div><div style="font-size:16px;font-weight:700;color:var(--red-fg)">'+rm(totExp)+'</div></div>'
      +'</div>';
    document.getElementById('pl-bot').innerHTML=''
      +'<div class="tile"><div class="tl">Revenue</div><div class="tv">'+rm(tot)+'</div></div>'
      +'<div class="tile t-red"><div class="tl">Expenses</div><div class="tv">'+rm(totExp)+'</div></div>'
      +'<div class="tile '+(net>=0?'t-green':'t-red')+'"><div class="tl">Net Profit</div><div class="tv"><span style="color:'+(net>=0?'var(--green-fg)':'var(--red-fg)')+'">'+rm(net)+'</span></div></div>'
      +'<div class="tile"><div class="tl">Margin %</div><div class="tv">'+(tot?Math.round(net/tot*100):0)+'%</div></div>';
    // Draw chart
    var ctx=document.getElementById('pl-chart');
    if(ctx){
      var labels=Array.from({length:12},function(_,i){return MONTHS[i+1].slice(0,3);});
      var revData=Array.from({length:12},function(_,i){
        var mo=i+1;
        return wi.filter(function(r){return gM(r.date)===mo&&gY(r.date)===py;}).reduce(function(s,r){return s+(+r.amount||0);},0)
          +orders.filter(function(r){return gM(r.pref_date)===mo&&gY(r.pref_date)===py;}).reduce(function(s,r){return s+(+r.total||0);},0);
      });
      var expData=Array.from({length:12},function(_,i){
        var mo=i+1;return exp.filter(function(r){return gM(r.date)===mo&&gY(r.date)===py;}).reduce(function(s,r){return s+(+r.amount||0);},0);
      });
      if(window._plChart)window._plChart.destroy();
      window._plChart=new Chart(ctx,{type:'bar',data:{labels:labels,datasets:[{label:'Revenue',data:revData,backgroundColor:'rgba(107,39,55,0.7)',borderRadius:6},{label:'Expenses',data:expData,backgroundColor:'rgba(163,32,32,0.4)',borderRadius:6}]},options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true,ticks:{callback:function(v){return'RM'+v.toLocaleString();}}}}}});
    }
    // Cash entries
    var ctb=document.getElementById('cash-tb');
    if(!cash.length){ctb.innerHTML=emp('arrows-exchange','No manual entries','');} 
    else {ctb.innerHTML=cash.map(function(c){return'<tr><td>'+fmtD(c.date)+'</td><td><span class="bdg '+(c.type==='Cash In'?'bdg-green':'bdg-red')+'">'+esc(c.type)+'</span></td><td>'+esc(c.description)+'</td><td><strong>'+rm(c.amount)+'</strong></td><td><button class="ib" onclick="delRow(\'cash_entries\',\''+c.id+'\',renderPL)"><i class="ti ti-trash"></i></button></td></tr>';}).join('');}
  }catch(e){}
}

// ── EXPORT/IMPORT HELPERS ─────────────────────────────────
function dlCSV(rows,filename){
  if(!rows.length)return toast('No data to export','err');
  var keys=Object.keys(rows[0]);
  var csv=keys.join(',')+'\n'+rows.map(function(r){return keys.map(function(k){var v=r[k]===null||r[k]===undefined?'':String(r[k]);return'"'+v.replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=filename+'.csv';a.click();
}
async function exportData(table,query,filename){
  try{var rows=await G(table,query||'');dlCSV(rows,filename);toast('Exported '+rows.length+' rows!');}catch(e){toast('Export failed','err');}
}
function importCSV(table,onDone){
  var inp=document.createElement('input');inp.type='file';inp.accept='.csv';
  inp.onchange=function(e){
    var file=e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=async function(ev){
      var lines=ev.target.result.split('\n').filter(Boolean);
      if(lines.length<2)return toast('Empty CSV','err');
      var headers=lines[0].split(',').map(function(h){return h.trim().replace(/^"|"$/g,'');});
      var rows=lines.slice(1).map(function(line){
        var vals=[];var cur='';var inQ=false;
        for(var i=0;i<line.length;i++){var c=line[i];if(c==='"')inQ=!inQ;else if(c===','&&!inQ){vals.push(cur);cur='';}else cur+=c;}
        vals.push(cur);
        var obj={};headers.forEach(function(h,i){obj[h]=vals[i]?vals[i].replace(/^"|"$/g,'').replace(/""/g,'"'):null;});
        return obj;
      });
      var ok=0;

function importProductsCSV(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.csv';
  inp.onchange=function(e){
    var file=e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=async function(ev){
      var lines=ev.target.result.split('\n').filter(Boolean);
      if(lines.length<2)return toast('Empty CSV','err');
      var headers=lines[0].split(',').map(function(h){return h.trim().replace(/^"|"$/g,'');});
      var prods=[];
      lines.slice(1).forEach(function(line){
        var vals=[];var cur='';var inQ=false;
        for(var i=0;i<line.length;i++){var c=line[i];if(c==='"')inQ=!inQ;else if(c===','&&!inQ){vals.push(cur);cur='';}else cur+=c;}vals.push(cur);
        var obj={};headers.forEach(function(h,i){obj[h]=vals[i]?vals[i].replace(/^"|"$/g,'').replace(/""/g,'"'):null;});
        if(obj.name||obj.product)prods.push({id:'p'+Date.now()+Math.random().toString(36).slice(2),name:obj.name||obj.product||'',category:obj.category||'General',price:+obj.price||0,cost:+obj.cost||0,flowers:obj.flowers||''});
      });
      var existing=S.products||[];
      var merged=existing.concat(prods);
      await saveSetting('products',merged);
      toast('Imported '+prods.length+' products!');renderSettTab('products');
    };
    reader.readAsText(file);
  };
  inp.click();
}

async function doCmp(){
  var el=document.getElementById('cmp-result');if(!el)return;
  var m1=+(document.getElementById('cm1')||{value:cM()}).value||cM();var y1=+(document.getElementById('cy1')||{value:cY()}).value||cY();
  var m2=+(document.getElementById('cm2')||{value:1}).value||1;var y2=+(document.getElementById('cy2')||{value:cY()}).value||cY();
  el.innerHTML='<div class="loading"><i class="ti ti-loader"></i>Loading...</div>';
  try{
    var res=await Promise.all([G('orders',''),G('walkin',''),G('expenses','')]);
    var orders=res[0],wi=res[1],exp=res[2];
    function calc(m,y){
      var mwi=wi.filter(function(r){return gM(r.date)===m&&gY(r.date)===y;}).reduce(function(s,r){return s+(+r.amount||0);},0);
      var mon=orders.filter(function(r){return gM(r.pref_date)===m&&gY(r.pref_date)===y;}).reduce(function(s,r){return s+(+r.total||0);},0);
      var mexp=exp.filter(function(r){return gM(r.date)===m&&gY(r.date)===y;}).reduce(function(s,r){return s+(+r.amount||0);},0);
      return{wi:mwi,on:mon,tot:mwi+mon,exp:mexp,net:mwi+mon-mexp,cnt:orders.filter(function(r){return gM(r.pref_date)===m&&gY(r.pref_date)===y;}).length};
    }
    var a=calc(m1,y1);var b=calc(m2,y2);
    function diff(va,vb){var d=va-vb;var p=vb?Math.round(Math.abs(d)/vb*100):0;return'<span style="font-size:12px;color:'+(d>0?'var(--green-fg)':d<0?'var(--red-fg)':'var(--tx3)')+'">'+(d>0?'+':'')+rm(d)+' ('+(d>=0?'+':'')+p+'%)</span>';}
    el.innerHTML='<div class="card"><div class="ch"><h3>'+MONTHS[m1]+' '+y1+' vs '+MONTHS[m2]+' '+y2+'</h3></div>'
      +'<div class="tw"><table><thead><tr><th>Metric</th><th>'+MONTHS[m1]+' '+y1+'</th><th>'+MONTHS[m2]+' '+y2+'</th><th>Change</th></tr></thead><tbody>'
      +'<tr><td>Walk-in</td><td>'+rm(a.wi)+'</td><td>'+rm(b.wi)+'</td><td>'+diff(a.wi,b.wi)+'</td></tr>'
      +'<tr><td>Online</td><td>'+rm(a.on)+'</td><td>'+rm(b.on)+'</td><td>'+diff(a.on,b.on)+'</td></tr>'
      +'<tr><td><strong>Total Revenue</strong></td><td><strong>'+rm(a.tot)+'</strong></td><td><strong>'+rm(b.tot)+'</strong></td><td>'+diff(a.tot,b.tot)+'</td></tr>'
      +'<tr><td>Expenses</td><td>'+rm(a.exp)+'</td><td>'+rm(b.exp)+'</td><td>'+diff(a.exp,b.exp)+'</td></tr>'
      +'<tr><td><strong>Net Profit</strong></td><td><strong style="color:'+(a.net>=0?'var(--green-fg)':'var(--red-fg)')+'">'+rm(a.net)+'</strong></td><td><strong style="color:'+(b.net>=0?'var(--green-fg)':'var(--red-fg)')+'">'+rm(b.net)+'</strong></td><td>'+diff(a.net,b.net)+'</td></tr>'
      +'<tr><td>Orders</td><td>'+a.cnt+'</td><td>'+b.cnt+'</td><td></td></tr>'
      +'</tbody></table></div></div>';
  }catch(e){}
}

function autoCalcTSHours(){
  var inn=(document.getElementById('ts-in')||{value:''}).value;
  var out=(document.getElementById('ts-out')||{value:''}).value;
  if(!inn||!out)return;
  var [ih,im]=inn.split(':').map(Number);var [oh,om]=out.split(':').map(Number);
  var mins=(oh*60+om)-(ih*60+im);if(mins<=0)return;
  var hrs=Math.round(mins/60*2)/2;
  document.getElementById('ts-hrs').value=hrs;
  calcTSAmt();
}
function calcTSAmt(){
  var hrs=+(document.getElementById('ts-hrs')||{value:0}).value||0;
  var rate=+(document.getElementById('ts-rate')||{value:0}).value||0;
  var amt=Math.round(hrs*rate*100)/100;
  document.getElementById('ts-amt').value=amt;
}

    socso:+(document.getElementById('ts-socso')||{value:0}).value||0,notes:(document.getElementById('ts-notes')||{value:''}).value.trim()};

}

async function updateProdField(pid,field,val){
  var prods=S.products||[];var p=prods.find(function(x){return x.id===pid;});if(!p)return;
  p[field]=+val||0;
  // Recalculate total cost if any cost field changed
  if(['mat_cost','pack_cost','labour_mins','labour_rate','delivery_cost'].indexOf(field)>-1){
    var lc=Math.round((p.labour_mins||0)/60*(p.labour_rate||9)*100)/100;
    p.labour_cost=lc;
    p.cost=Math.round(((p.mat_cost||0)+(p.pack_cost||0)+lc+(p.delivery_cost||0))*100)/100;
  }
  // Only update the margin display for this row — no full re-render
  var margin=p.price?Math.round((p.price-p.cost)/p.price*100):0;
  var mc=margin>=55?'var(--green-fg)':margin>=40?'var(--amber-fg)':'var(--red-fg)';
  var mg=document.getElementById('mg-'+pid);if(mg){mg.style.color=mc;mg.textContent=margin+'%';}
  await saveSetting('products',prods);
  toast('Saved ✓');
}

  var optsHTML='';if(cf.type==='select'&&cf.options&&cf.options.length){optsHTML=cf.options.map(function(o,j){return'<div style="display:flex;gap:6px;margin-bottom:5px" id="cfopt-'+i+'-'+j+'"><input class="inp-sm" id="cfo-'+i+'-'+j+'" value="'+esc(o)+'" placeholder="Option '+j+'" style="flex:1"><button class="ib" onclick="removeCFOpt('+i+','+j+')"><i class="ti ti-x"></i></button></div>';}).join('');}
  return'<div class="tile" id="cf-row-'+i+'" style="margin-bottom:8px;padding:12px">'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">'
    +'<div class="grp" style="flex:2;min-width:140px"><label>Field Label *</label><input class="inp-sm" id="cf-lbl-'+i+'" value="'+esc(cf.label||'')+'" placeholder="e.g. Colour Preference" style="width:100%"></div>'
    +'<div class="grp" style="flex:1;min-width:100px"><label>Type</label><select class="sel-sm" id="cf-type-'+i+'" onchange="toggleCFOptions('+i+')" style="width:100%"><option value="text"'+(cf.type==='text'?' selected':'')+'>Text</option><option value="select"'+(cf.type==='select'?' selected':'')+'>Dropdown</option></select></div>'
    +'<div class="grp" style="flex:1;min-width:60px"><label>Required?</label><select class="sel-sm" id="cf-req-'+i+'" style="width:100%"><option value="false"'+(cf.required?'':' selected')+'>No</option><option value="true"'+(cf.required?' selected':'')+'>Yes</option></select></div>'
    +'<button class="ib" onclick="removeCustomField('+i+')" title="Remove"><i class="ti ti-trash"></i></button>'
    +'</div>'
    +'<div id="cf-opts-wrap-'+i+'" style="margin-top:8px;'+(cf.type==='select'?'':'display:none')+'">'
    +'<label style="font-size:11px;font-weight:600;color:var(--tx2);display:block;margin-bottom:6px">Dropdown Options</label>'
    +'<div id="cfopts-'+i+'">'+optsHTML+'</div>'
    +'<button class="btn sm" onclick="addCFOpt('+i+')" style="margin-top:4px"><i class="ti ti-plus"></i> Add Option</button>'
    +'</div>'
    +'<div class="grp" style="margin-top:8px"><label>Placeholder / Hint</label><input class="inp-sm" id="cf-ph-'+i+'" value="'+esc(cf.placeholder||'')+'" placeholder="e.g. Choose your preferred colour" style="width:100%"></div>'
    +'</div>';
}

function toggleCFOptions(i){
  var type=(document.getElementById('cf-type-'+i)||{value:'text'}).value;
  var wrap=document.getElementById('cf-opts-wrap-'+i);
  if(wrap)wrap.style.display=type==='select'?'':'none';
}
function addCFOpt(i){
  var con=document.getElementById('cfopts-'+i);if(!con)return;
  var j=con.children.length;
  con.insertAdjacentHTML('beforeend','<div style="display:flex;gap:6px;margin-bottom:5px" id="cfopt-'+i+'-'+j+'"><input class="inp-sm" id="cfo-'+i+'-'+j+'" placeholder="Option '+(j+1)+'" style="flex:1"><button class="ib" onclick="removeCFOpt('+i+','+j+')"><i class="ti ti-x"></i></button></div>');
}
function removeCFOpt(i,j){var el=document.getElementById('cfopt-'+i+'-'+j);if(el)el.remove();}

function addCustomField(){
  var fs=getFormSettings();
  if(!fs.custom_fields)fs.custom_fields=[];
  var i=(document.querySelectorAll('[id^="cf-row-"]')||[]).length;
  var list=document.getElementById('custom-fields-list');
  if(list)list.insertAdjacentHTML('beforeend',renderCustomFieldRow({id:'cf_'+Date.now(),label:'',type:'text',required:false,placeholder:'',options:[]},i));
}

function removeCustomField(i){
  var row=document.getElementById('cf-row-'+i);if(row)row.remove();
}

async function saveFormSettings(){
  var fs={fields:{},custom_fields:[]};
  var stdIds=['addon','wish','message','time','receiver'];
  stdIds.forEach(function(id){var tog=document.getElementById('fstog-'+id);fs.fields[id]={enabled:tog?tog.classList.contains('tog-on'):true};});
  // Collect custom fields
  var rows=document.querySelectorAll('[id^="cf-row-"]');
  rows.forEach(function(row){
    var i=row.id.replace('cf-row-','');
    var lbl=(document.getElementById('cf-lbl-'+i)||{value:''}).value.trim();
    if(!lbl)return;
    var type=(document.getElementById('cf-type-'+i)||{value:'text'}).value;
    var req=(document.getElementById('cf-req-'+i)||{value:'false'}).value==='true';
    var ph=(document.getElementById('cf-ph-'+i)||{value:''}).value.trim();
    var opts=[];
    if(type==='select'){
      var optsContainer=document.getElementById('cfopts-'+i);
      if(optsContainer){optsContainer.querySelectorAll('input').forEach(function(inp){var v=inp.value.trim();if(v)opts.push(v);});}
    }
    fs.custom_fields.push({id:'cf_'+i,label:lbl,type:type,required:req,placeholder:ph,options:opts});
  });
  await saveSetting('form_settings',fs);
  toast('Form settings saved! 🌸 Categories & products auto-sync from Product Sheet.');
}


// ── CUSTOMER ORDER FORM ───────────────────────────────────
function renderOrderForm(){
  var prods=S.products||[];
  var cats=S.product_categories||DEF_SETTINGS.product_categories;
  var fs=getFormSettings();var ff=fs.fields||{};
  var prodOpts='<option value="">Select a product...</option>';
  cats.forEach(function(cat){
    // Include products even if price is 0 — only skip if price is null/undefined
    var cp=prods.filter(function(p){return p.category===cat&&p.price!=null;});
    if(cp.length){
      prodOpts+='<optgroup label="'+cat+'">';
      cp.forEach(function(p){
        var label=p.name+(p.price>0?' — RM'+p.price:'');
        prodOpts+='<option value="'+p.name+'">'+label+'</option>';
      });
      prodOpts+='</optgroup>';
    }
  });
  // Fallback: if no products configured yet, show a placeholder
  if(prodOpts==='<option value="">Select a product...</option>'){
    prodOpts+='<option disabled>— No products set up yet —</option>';
  }
  var cfHTML=(fs.custom_fields||[]).map(function(cf){if(!cf.label)return'';
    var inp=cf.type==='select'?'<select id="cf-custom-'+cf.id+'"><option value="">'+esc(cf.placeholder||'Select...')+'</option>'+(cf.options||[]).map(function(o){return'<option>'+esc(o)+'</option>';}).join('')+'</select>'
      :'<input id="cf-custom-'+cf.id+'" placeholder="'+esc(cf.placeholder||'')+'">';
    return'<div class="cfgrp"><label>'+esc(cf.label)+(cf.required?' <span class=\"req\">*</span>':'')+'</label>'+inp+'</div>';}).join('');
  document.getElementById('root').innerHTML='<div class="cform-wrap"><div class="cform-card">'
    +'<div class="cform-head"><div class="cform-title">FINE FLOWERS STUDIO</div><div class="cform-div"></div><div class="cform-tag">blooming beautifully with love</div></div>'
    +'<div class="cform-outer-label">BOOKING FORM</div>'
    +'<div class="cform-desc">Kindly fill in this order form to secure your booking and click submit once done.</div>'
    +'<div class="cform-body">'
    +'<div class="cform-sec">Your Details</div>'
    +'<div class="cfgrp"><label>Full Name <span class="req">*</span></label><input id="cf-name" placeholder="e.g. Siti Nurhaliza"></div>'
    +'<div class="cfgrp"><label>Phone Number <span class="req">*</span></label><input id="cf-phone" placeholder="e.g. 0123456789" type="tel"></div>'
    +'<div class="cform-sec">Your Order</div>'
    +'<div class="cfgrp"><label>Product <span class="req">*</span></label><select id="cf-product">'+prodOpts+'</select></div>'
    +'<div class="cfgrp"><label>Preferred Date <span class="req">*</span></label><input type="date" id="cf-date"></div>'
    +(fsEnabled(ff,'time')?'<div class="cfgrp"><label>Preferred Time</label><input type="time" id="cf-time"></div>':'<input type="hidden" id="cf-time">')
    +(fsEnabled(ff,'message')?'<div class="cfgrp"><label>Message / Special Request</label><textarea id="cf-msg" placeholder="e.g. colour preference, size, occasion..."></textarea></div>':'<input type="hidden" id="cf-msg">')
    +(fsEnabled(ff,'wish')?'<div class="cfgrp"><label>Wish Card Message (if any)</label><textarea id="cf-wish" placeholder="What would you like us to write on the card?"></textarea></div>':'<input type="hidden" id="cf-wish">')
    +(fsEnabled(ff,'addon')?'<div class="cfgrp"><label>Add-on (optional)</label><select id="cf-addon"><option value="">No add-on</option>'+(function(){var addons=(S&&S.products||[]).filter(function(p){return p.category==="Add-on";});var drinks=["Ice Strawberry Matcha (RM15)","Ice Creamy Latte (RM12)","Ice Latte (RM11)"];var opts="";addons.forEach(function(p){opts+="<option>"+p.name+(p.price?" (RM"+p.price+")":"")+"</option>";});if(!addons.length)drinks.forEach(function(d){opts+="<option>"+d+"</option>";});return opts;})()+'</select></div>':'<input type="hidden" id="cf-addon">')
    +cfHTML
    +'<div class="cfgrp"><label>Delivery / Pickup <span class="req">*</span></label><select id="cf-dtype" onchange="toggleCFAddr()"><option value="">Select...</option><option value="Self-pickup">Self-pickup</option><option value="Delivery">Delivery</option></select></div>'
    +'<div class="cfgrp" id="cf-addr-grp" style="display:none"><label>Delivery Address <span class="req">*</span></label><textarea id="cf-addr" placeholder="Full delivery address including postcode"></textarea></div>'
    +(fsEnabled(ff,'receiver')?'<div class="cform-sec">Receiver (if different from buyer)</div><div class="cfgrp"><label>Receiver Name</label><input id="cf-rname" placeholder="Leave blank if same as above"></div><div class="cfgrp"><label>Receiver Phone</label><input id="cf-rphone" placeholder="Leave blank if same"></div>':'<input type="hidden" id="cf-rname"><input type="hidden" id="cf-rphone">')
    +'<button class="cform-submit" id="cf-btn" onclick="submitForm()">Submit Booking</button>'
    +'<div class="cform-submit-note">By submitting, you will be redirected to WhatsApp. We will confirm your booking and payment details shortly. Thank you!</div>'
    +'</div><div class="cform-footer">Thank you for choosing Fine Flowers Studio 🌸</div>'
    +'</div></div>';
}
function toggleCFAddr(){
  var t=(document.getElementById('cf-dtype')||{value:''}).value;
  var ag=document.getElementById('cf-addr-grp');if(ag)ag.style.display=t==='Delivery'?'':'none';
}
async function submitForm(){
  var name=(document.getElementById('cf-name')||{value:''}).value.trim();
  var phone=(document.getElementById('cf-phone')||{value:''}).value.trim();
  var prod=(document.getElementById('cf-product')||{value:''}).value;
  var dtype=(document.getElementById('cf-dtype')||{value:''}).value;
  var date=(document.getElementById('cf-date')||{value:''}).value;
  if(!name||!phone||!prod||!dtype){alert('Please fill in all required fields (*).');return;}
  if(dtype==='Delivery'&&!(document.getElementById('cf-addr')||{value:''}).value.trim()){alert('Please enter delivery address.');return;}
  var btn=document.getElementById('cf-btn');if(btn){btn.disabled=true;btn.textContent='Submitting...';}
  try{
    await P('orders',{cname:name,cphone:phone.replace(/[^0-9]/g,''),product:prod,pref_date:date||td(),pref_time:(document.getElementById('cf-time')||{value:''}).value,type:dtype,addr:dtype==='Delivery'?(document.getElementById('cf-addr')||{value:''}).value.trim():'',rname:(document.getElementById('cf-rname')||{value:''}).value.trim(),rphone:(document.getElementById('cf-rphone')||{value:''}).value.trim(),wish:(document.getElementById('cf-wish')||{value:''}).value.trim(),addon:(document.getElementById('cf-addon')||{value:''}).value,remark:(document.getElementById('cf-msg')||{value:''}).value.trim(),status:'Pending',channel:'Online Form'});
  }catch(e){console.warn('Save error',e);}
  var waNum=S.business&&S.business.phone||WA_NUM;
  var msg='Hi, I\'ve submitted the booking form under the name: '+name;
  setTimeout(function(){window.location.href='https://wa.me/'+waNum+'?text='+encodeURIComponent(msg);},400);
}

// ── INIT ──────────────────────────────────────────────────
async function main(){
  await loadSettings();
  if(isForm){renderOrderForm();return;}
  renderLogin();
}
window.onload=function(){
  // Customer order form does NOT need Chart.js — load immediately
  if(isForm){main();return;}
  // Staff dashboard needs Chart.js
  if(!window.Chart){
    var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
    s.onerror=function(){main();}; // still boot even if Chart.js fails
    s.onload=function(){main();};document.head.appendChild(s);
  } else {main();}
};
</script>
